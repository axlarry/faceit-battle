# faceit.lacurte.ro — React SPA + PHP + proxy steam-id
# Repair 2026-10-13: php-fpm wiring, recordings media, steamid proxy, 503 stubs for missing stream backend

server {
    listen 80;
    listen [::]:80;
    server_name faceit.lacurte.ro;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name faceit.lacurte.ro;

    ssl_certificate /etc/letsencrypt/live/faceit.lacurte.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faceit.lacurte.ro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    quic_retry on;
    add_header Alt-Svc 'h3=":443"; ma=86400;' always;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /var/www/faceit-app;
    index index.html;

    # --- PHP endpoints (executed via php-fpm, not served as text) ---
    location = /recordings.php {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location = /delete-recording.php {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # --- Steam ID resolver: proxy to local :3000 backend (no router port-forward needed) ---
    location = /api/steamid {
        proxy_pass https://192.168.1.110:3000/api/steamid$is_args$args;
        proxy_ssl_verify off;
        proxy_set_header Host lacurte.ro;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }

    # --- Recording media (mp4 + php-generated thumbnails) ---
    location /recordings/thumbnails/ {
        alias /media/SSHD1TB/recordings_faceit/thumbnails/;
        add_header Access-Control-Allow-Origin *;
    }
    location /recordings/ {
        alias /media/SSHD1TB/recordings_faceit/live/;
        add_header Access-Control-Allow-Origin *;
    }

    # --- Live-stream relay: OwO backend missing on host ---
    location /stream-api {
        default_type application/json;
        return 503 '{"error":"stream backend offline","paths":[],"totalPaths":0}';
    }
    location /hls {
        default_type application/json;
        return 503 '{"error":"stream backend offline"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/faceit.lacurte.ro_access.log;
    error_log /var/log/nginx/faceit.lacurte.ro_error.log;
}
